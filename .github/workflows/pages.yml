name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax and deterministic tests
        run: npm test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static site
        run: |
          mkdir _site
          cp index.html styles.css enhancements.css app.js music-theory.mjs _site/
          cp sitemap.xml site.webmanifest 187698fd6565dcfce23484648701f559.txt _site/
          cp -R assets _site/

          # Temporary public deployment mirror for the private History Through CU
          # project. Canonical source remains krahd/history-through-cu/site/.
          # Copy the mirror as a unit so its active entry point and runtime cannot
          # diverge when the prototype version changes.
          mkdir -p _site/history-through-cu
          cp -R deployments/history-through-cu/. _site/history-through-cu/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
