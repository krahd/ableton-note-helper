name: Sync History Through CU v2 mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-history-through-cu-v2.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical release artifact
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-07b0-820e-982c-b76c39aab092/raw?se=2026-08-13T07%3A56%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=5c3e8b98-6904-51a3-876b-b895b84a90cc&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T04%3A13%3A22Z&ske=2026-08-14T04%3A13%3A22Z&sks=b&skv=2026-02-06&sig=rKHCHlP/hDU4cKPTaN4wPueREYAJKWwBrkOa0lAG2nE%3D' -o /tmp/history-through-cu.zip
      - name: Replace mirror from canonical artifact
        run: |
          find deployments/history-through-cu -mindepth 1 -maxdepth 1 ! -name 'README.md' ! -name '.nojekyll' -exec rm -rf {} +
          unzip -q /tmp/history-through-cu.zip -d deployments/history-through-cu
          test -f deployments/history-through-cu/index.html
          test -f deployments/history-through-cu/app.js
          test -f deployments/history-through-cu/styles.css
          test -f deployments/history-through-cu/data.js
      - name: Commit exact release mirror
        run: |
          rm .github/workflows/sync-history-through-cu-v2.yml
          git config user.name 'Tomas Laurenzo'
          git config user.email 'tomas@laurenzo.net'
          git add deployments/history-through-cu .github/workflows/sync-history-through-cu-v2.yml
          git commit -m 'Publish final History Through CU v2 mirror'
          git push
